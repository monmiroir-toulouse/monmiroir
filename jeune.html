<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon Miroir - Thomas</title>

<style>
body {
    font-family: Arial;
    background: #f2f2f2;
}

#chat {
    width: 420px;
    height: 500px;
    margin: 20px auto;
    background: white;
    border-radius: 10px;
    padding: 10px;
    overflow-y: auto;
}

.message {
    margin: 8px 0;
}

.bot {
    color: blue;
}

.user {
    text-align: right;
    color: green;
}

button {
    display: block;
    margin: 6px 0;
    padding: 10px;
}

#inputZone {
    width: 420px;
    margin: auto;
    display: flex;
}

#input {
    flex: 1;
    padding: 10px;
}
</style>

</head>

<body>

<div id="chat"></div>

<div id="inputZone">
    <input id="input" placeholder="Écris ici..." />
    <button onclick="send()">Envoyer</button>
</div>

<script>

let step = 0;

// afficher message
function addMessage(text, type) {
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

// ajouter bouton
function addButton(text) {
    let btn = document.createElement("button");
    btn.innerText = text;

    btn.onclick = function () {
        addMessage(text, "user");
        botResponse(text);
    };

    document.getElementById("chat").appendChild(btn);
}

// envoyer texte libre
function send() {
    let input = document.getElementById("input");
    let text = input.value;

    if (text === "") return;

    addMessage(text, "user");
    input.value = "";

    botResponse(text);
}

// logique chatbot
function botResponse(text) {

    if (step === 0) {
        addMessage("Salut. Moi c’est Thomas.", "bot");
        addMessage("Je suis là pour t’aider à raconter ton histoire.", "bot");

        addMessage("Tu préfères :", "bot");

        addButton("Raconter ce qui s’est passé");
        addButton("Parler de moi");

        step++;
    }

    else if (step === 1) {
        if (text.includes("Raconter")) {
            addMessage("Ok, raconte avec tes mots.", "bot");
        }

        else if (text.includes("Parler")) {
            addMessage("Comment tu te sens en ce moment ?", "bot");
        }

        else {
            addMessage("Vas-y, dis-moi plus.", "bot");
        }

        step++;
    }

    else if (step === 2) {
        addMessage("À ce moment-là, t’avais quoi en tête ?", "bot");
        step++;
    }

    else {
        addMessage("Merci. On continue si tu veux.", "bot");
    }
}

// message de départ
addMessage("Bienvenue dans Mon Miroir.", "bot");
addMessage("On commence quand tu veux.", "bot");

</script>

</body>
</html>
