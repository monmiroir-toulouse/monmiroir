<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon Miroir - Espace jeune</title>
</head>

<body style="font-family: Arial; padding:20px;">

<h2>Parle librement</h2>

<p>
Ici, tu peux raconter ton parcours comme tu veux.
Il n’y a pas de bonne ou mauvaise réponse.
</p>

<p>
Tu peux écrire en français, en darija, ou comme tu veux.
</p>

<textarea rows="10" style="width:100%;"></textarea>

<br><br>

<button onclick="envoyer()" style="padding:10px 20px;">Envoyer</button>

<p id="message" style="margin-top:15px;color:green;"></p>

<script>
function envoyer() {
  let textarea = document.querySelector("textarea");
  let texte = textarea.value.trim();

  if (texte === "") {
    document.getElementById("message").textContent = "Tu peux écrire quelque chose avant d’envoyer.";
    return;
  }



</body>
</html>
