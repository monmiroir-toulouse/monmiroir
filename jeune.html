<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Miroir - Test</title>
    <style>
        body { background: #fdf6f2; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .mirror { width: 300px; height: 300px; border-radius: 50%; border: 10px solid white; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .status { margin-top: 20px; padding: 15px; background: white; border-radius: 15px; width: 80%; text-align: center; }
    </style>
</head>
<body>

    <div class="mirror">
        <video id="v" autoplay loop muted playsinline>
            <!-- Ligne de test (le lapin) -->
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        </video>
    </div>

    <div class="status" id="out">Si vous voyez un lapin, le Miroir fonctionne !</div>

    <script>
        // Ce petit script forcera la vidéo à se lancer
        window.onload = () => { document.getElementById('v').play(); };
    </script>
</body>
</html>
