<!DOCTYPE html>
<html>
<body>

<div id="chat"></div>

<script>

document.getElementById("chat").innerHTML = "JS MARCHE ✔️";

function addButton(text) {
    let btn = document.createElement("button");
    btn.innerText = text;

    btn.onclick = function () {
        alert("Tu as cliqué : " + text);
    };

    document.getElementById("chat").appendChild(btn);
}

addButton("Test bouton 1");
addButton("Test bouton 2");

</script>

</body>
</html>
