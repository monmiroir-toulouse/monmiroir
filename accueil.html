<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mon Miroir 2.0 — Accueil</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Nunito:wght@400;600;800&family=Noto+Sans+Tifinagh&family=Noto+Sans+Ethiopic&display=swap" rel="stylesheet">
  
<style>
  :root {
    --bg: #10202e;
    --chat-bg: rgba(23, 45, 63, 0.90);
    --bubble-mirror: #2b5576;
    --bubble-user: #3f755b;
    --gold: #d2b15b;
    --green-record: #4f9b72;
    --red-stop: #d6605b;
    --text: #f4f1e9;
    --text-soft: #a7b6c2;
    --orange: #d96c3d;
    --vert: #7fa95f;
    --panel: rgba(31, 61, 84, 0.82);
    --panel-strong: rgba(24, 49, 68, 0.94);
    --border: rgba(210, 177, 91, 0.22);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    min-height: 100%;
    width: 100%;
    overflow-x: hidden;
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
  }

  /* ── FOND CVI ── */
  #accueil {
    min-height: 100vh;
    background-image: url('/fond-cvi.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 20px 24px;
  }

  /* Voile plus uniforme et plus élégant */
  #accueil::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(13, 28, 40, 0.48) 0%, rgba(13, 28, 40, 0.58) 100%),
      rgba(15, 25, 35, 0.08);
    z-index: 1;
  }

  #accueil > * {
    position: relative;
    z-index: 2;
  }

  /* ── HEADER ── */
  .header-accueil {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }

  .header-accueil h1 {
    font-family: 'Tajawal', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.20);
  }

  .header-accueil .sous-titre {
    margin-top: 2px;
    font-size: 11px;
    color: #b7c3cc;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── MENU LANGUE ── */
  .langue-menu {
    position: relative;
  }

  .langue-btn {
    background: rgba(31, 61, 84, 0.72);
    border: 1px solid rgba(210,177,91,0.34);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: all 0.2s ease;
  }

  .langue-btn:hover {
    background: rgba(39, 76, 103, 0.90);
    border-color: rgba(210,177,91,0.52);
  }

  .langue-liste {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    background: rgba(27, 54, 74, 0.98);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    margin-top: 8px;
    min-width: 150px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    z-index: 100;
  }

  .langue-liste.visible { display: block; }

  .langue-liste button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 10px 14px;
    border-radius: 9px;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }

  .langue-liste button:hover {
    background: rgba(255,255,255,0.08);
  }

  /* ── MENU PRINCIPAL ── */
  .menu-principal {
    width: 100%;
    max-width: 500px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }

  .menu-btn {
    background: rgba(33, 66, 91, 0.84);
    border: 1px solid rgba(210,177,91,0.22);
    border-radius: 16px;
    padding: 18px 14px;
    min-height: 88px;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    font-size: 14px;
    transition: all 0.2s ease;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  .menu-btn:hover {
    background: rgba(42, 81, 109, 0.94);
    border-color: rgba(210,177,91,0.42);
    transform: translateY(-1px);
  }

  .menu-btn:active {
    transform: scale(0.985);
  }

  .menu-btn .icone {
    display: block;
    font-size: 23px;
    margin-bottom: 7px;
  }

  /* ── CHAT ── */
  .chat-zone {
    width: 100%;
    max-width: 500px;
    flex: 1;
    min-height: 300px;
    max-height: 400px;
    background: linear-gradient(
      180deg,
      rgba(23, 46, 64, 0.92) 0%,
      rgba(19, 39, 55, 0.94) 100%
    );
    border: 1px solid rgba(210,177,91,0.12);
    border-radius: 18px;
    padding: 16px;
    overflow-y: auto;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .chat-zone::-webkit-scrollbar { display: none; }

  .bubble-wrap {
    display: flex;
    flex-direction: column;
    animation: popIn 0.3s ease forwards;
  }

  .bubble-wrap.mirror { align-items: flex-start; }
  .bubble-wrap.user { align-items: flex-end; }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.96) translateY(4px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .bubble {
    max-width: 84%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.5;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
  }

  .bubble.mirror {
    background: var(--bubble-mirror);
    border-bottom-left-radius: 4px;
  }

  .bubble.user {
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }

  .bubble.rtl {
    font-family: 'Tajawal', sans-serif;
    font-size: 18px;
    direction: rtl;
  }

  .timestamp {
    font-size: 10px;
    color: var(--text-soft);
    margin-top: 3px;
    padding: 0 4px;
  }

  .typing-dots {
    background: var(--bubble-mirror);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-soft);
    animation: typingBounce 1.2s ease-in-out infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-6px); background: var(--gold); }
  }

  /* ── BARRE DE SAISIE ── */
  .saisie-bar {
    width: 100%;
    max-width: 500px;
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
  }

  .saisie-field {
    flex: 1;
    background: rgba(31, 61, 84, 0.62);
    border: 1px solid rgba(210,177,91,0.26);
    border-radius: 24px;
    padding: 12px 18px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Nunito', sans-serif;
    outline: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .saisie-field::placeholder { color: #aab8c3; }

  .saisie-field:focus {
    border-color: rgba(210,177,91,0.65);
    background: rgba(31, 61, 84, 0.78);
  }

  .btn-envoyer {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--gold);
    color: #142331;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 14px rgba(0,0,0,0.16);
  }

  .btn-envoyer:hover {
    filter: brightness(1.04);
  }

  /* ── FOOTER ── */
  .footer-accueil {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 0 8px;
  }

  .footer-accueil img {
    width: 72px;
    margin-bottom: 8px;
    opacity: 0.94;
  }

  .footer-accueil p {
    font-size: 10px;
    color: #9fb0bd;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ── RETOUR ── */
  .retour-menu {
    display: inline-block;
    background: var(--gold);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 16px;
  }

  @media (max-width: 560px) {
    #accueil {
      padding: 18px 14px 20px;
      background-attachment: scroll;
    }

    .header-accueil {
      margin-bottom: 16px;
    }

    .header-accueil h1 {
      font-size: 20px;
    }

    .menu-principal {
      gap: 10px;
      margin-bottom: 14px;
    }

    .menu-btn {
      min-height: 82px;
      padding: 15px 10px;
      font-size: 13px;
    }

    .chat-zone {
      min-height: 280px;
      max-height: 390px;
      border-radius: 16px;
    }

    .footer-accueil {
      padding-top: 12px;
    }
  }
</style>

</head>
<body>

<div id="accueil">

  <!-- HEADER (SANS MIROIR) -->
  <div class="header-accueil">
    <div>
      <h1>Mon Miroir 2.0</h1>
      <div class="sous-titre">L'ÉVEIL ET LE SUIVI</div>
    </div>
    <!-- MENU LANGUE -->
    <div class="langue-menu">
      <button class="langue-btn" onclick="toggleLangue()">🌐 Langue ▼</button>
      <div class="langue-liste" id="langueListe">
        <button onclick="choisirLangue('fr')">Français</button>
        <button onclick="choisirLangue('ar')">العربية</button>
        <button onclick="choisirLangue('ber')">ⴰⵎⴰⵣⵉⵖ</button>
        <button onclick="choisirLangue('en')">English</button>
        <button onclick="choisirLangue('bm')">Bambara</button>
        <button onclick="choisirLangue('ti')">ትግርኛ</button>
      </div>
    </div>
  </div>

  <!-- MENU PRINCIPAL -->
  <div class="menu-principal">
    <a href="/accueil.html?mode=penal" class="menu-btn">
      <span class="icone">⚖️</span> Pénal
    </a>
    <a href="/orientation.html" class="menu-btn">
      <span class="icone">🎯</span> Orientation
    </a>
    <a href="/post-audience.html" class="menu-btn">
      <span class="icone">📄</span> Post-audience
    </a>
    <a href="/mes-rendez-vous.html" class="menu-btn">
      <span class="icone">📅</span> Mes rendez-vous
    </a>
  </div>

  <!-- CHAT -->
  <div class="chat-zone" id="chatZone">
    <div class="bubble-wrap mirror">
      <div class="bubble mirror">Je suis là. Tu peux parler.</div>
    </div>
  </div>

  <!-- BARRE DE SAISIE -->
  <div class="saisie-bar">
    <input class="saisie-field" id="saisieField" type="text" placeholder="Écris ton message...">
    <button class="btn-envoyer" id="btnEnvoyer">➤</button>
  </div>

  <!-- FOOTER (LOGO ENVOL PRODUCTION) -->
  <div class="footer-accueil">
    <img src="/logo-envol.jpg" alt="Envol Production">
    <p>Envol Production</p>
  </div>

</div>

<script>
  // ── CONFIG ──
  const API_CHAT = '/api/chat';
  var selectedLang = localStorage.getItem('monmiroir_langue') || 'fr';
  var conversationHistory = [];

  // ── DOM ──
  var chatZone = document.getElementById('chatZone');
  var saisieField = document.getElementById('saisieField');
  var btnEnvoyer = document.getElementById('btnEnvoyer');

  // ── MENU LANGUE ──
  function toggleLangue() {
    document.getElementById('langueListe').classList.toggle('visible');
  }

  function choisirLangue(lang) {
    selectedLang = lang;
    localStorage.setItem('monmiroir_langue', lang);
    document.getElementById('langueListe').classList.remove('visible');
    location.reload();
  }

  // ── ENVOYER UN MESSAGE ──
  async function envoyerMessage() {
    var texte = saisieField.value.trim();
    if (!texte) return;
    saisieField.value = '';

    // Ajouter la bulle utilisateur
    ajouterBulle(texte, 'user');
    conversationHistory.push({ role: 'user', content: texte });

    // Ajouter les typing dots
    ajouterTyping();

    try {
      var res = await fetch(API_CHAT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: conversationHistory,
          language: selectedLang,
          mode: 'miroir'
        })
      });
      var data = await res.json();
      var reply = data.reply || 'Je suis là.';
      conversationHistory.push({ role: 'assistant', content: reply });
      retirerTyping();
      ajouterBulle(reply, 'mirror');
    } catch (err) {
      retirerTyping();
      ajouterBulle('Je suis là.', 'mirror');
    }
  }

  // ── AJOUTER UNE BULLE ──
  function ajouterBulle(texte, type) {
    var wrap = document.createElement('div');
    wrap.className = 'bubble-wrap ' + type;
    var isRtl = /[\u0600-\u06FF]/.test(texte);
    var bubbleClass = 'bubble ' + type + (isRtl ? ' rtl' : '');
    wrap.innerHTML = '<div class="' + bubbleClass + '">' + texte + '</div>' +
      '<div class="timestamp">' + now() + '</div>';
    chatZone.appendChild(wrap);
    chatZone.scrollTop = chatZone.scrollHeight;
  }

  // ── TYPING DOTS ──
  function ajouterTyping() {
    var wrap = document.createElement('div');
    wrap.className = 'bubble-wrap mirror';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    chatZone.appendChild(wrap);
    chatZone.scrollTop = chatZone.scrollHeight;
  }
  function retirerTyping() {
    var t = document.getElementById('typingIndicator');
    if (t) t.remove();
  }

  // ── HEURE ──
  function now() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  // ── ÉVÉNEMENTS ──
  btnEnvoyer.addEventListener('click', envoyerMessage);
  saisieField.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') envoyerMessage();
  });

  // ── GESTION DU MODE (PENAL / ORIENTATION) ──
  var urlParams = new URLSearchParams(window.location.search);
  var mode = urlParams.get('mode');
  if (mode === 'penal') {
    saisieField.value = 'Explique-moi le contrôle judiciaire';
  }
</script>

</body>
</html>
