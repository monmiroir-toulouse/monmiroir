<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mon Miroir 2.0 — Accueil</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Nunito:wght@400;600;800&family=Noto+Sans+Tifinagh&family=Noto+Sans+Ethiopic&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F1923;
      --chat-bg: #0A1520;
      --bubble-mirror: #1A3A5C;
      --bubble-user: #1E5C3A;
      --gold: #C9A84C;
      --green-record: #25D366;
      --red-stop: #E53935;
      --text: #F0EDE6;
      --text-soft: #7A8FA6;
      --orange: #E64A19;
      --vert: #8BC34A;
    }
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    #accueil {
      min-height: 100vh;
      width: 100%;
      background-image: url('/fond-cvi.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #accueil::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15, 25, 35, 0.5);
      z-index: 1;
      pointer-events: none;
    }

    #accueil > * {
      position: relative;
      z-index: 2;
    }

    .header-accueil {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 9999;
    }
    .header-accueil h1 {
      font-family: 'Tajawal', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
    }
    .header-accueil .sous-titre {
      font-size: 11px;
      color: var(--text-soft);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .langue-menu { position: relative; }
    .langue-btn {
      background: rgba(201, 168, 76, 0.15);
      border: 1px solid rgba(201, 168, 76, 0.5);
      color: var(--gold);
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }
    .langue-liste {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: rgba(26, 58, 92, 0.98);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 16px;
      padding: 8px;
      margin-top: 8px;
      min-width: 160px;
      max-height: 60vh;
      overflow-y: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      z-index: 10000;
    }
    .langue-liste.visible { display: block; }
    .langue-liste button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }
    .langue-liste button:hover {
      background: rgba(201, 168, 76, 0.2);
    }

    .menu-principal {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .menu-btn {
      min-height: 82px;
      padding: 15px 10px;
      font-size: 13px;
      background: rgba(26, 58, 92, 0.9);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .menu-btn:hover {
      background: rgba(201, 168, 76, 0.15);
      border-color: var(--gold);
      transform: scale(1.02);
    }
    .menu-btn .icone {
      display: block;
      font-size: 24px;
      margin-bottom: 6px;
    }

    .chat-zone {
      width: 100%;
      max-width: 500px;
      min-height: 250px;
      max-height: 350px;
      background: rgba(10, 21, 32, 0.9);
      border-radius: 16px;
      padding: 16px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-zone::-webkit-scrollbar { display: none; }

    .bubble-wrap { display: flex; flex-direction: column; }
    .bubble-wrap.mirror { align-items: flex-start; }
    .bubble-wrap.user { align-items: flex-end; }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
    }
    .bubble.mirror { background: var(--bubble-mirror); border-bottom-left-radius: 4px; }
    .bubble.user { background: var(--bubble-user); border-bottom-right-radius: 4px; }
    .bubble.rtl { font-family: 'Tajawal', sans-serif; font-size: 18px; direction: rtl; }
    .timestamp { font-size: 10px; color: var(--text-soft); margin-top: 3px; padding: 0 4px; }

    .typing-dots {
      background: var(--bubble-mirror);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--text-soft);
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); background: var(--gold); } }

    .saisie-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 20px;
    }
    .saisie-field {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 24px;
      padding: 12px 18px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Nunito', sans-serif;
      outline: none;
    }
    .saisie-field::placeholder { color: var(--text-soft); }
    .saisie-field:focus { border-color: var(--gold); }
    .btn-envoyer {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--gold);
      color: var(--bg);
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-accueil {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
    }
    .footer-accueil img {
      width: 80px;
      margin-bottom: 8px;
    }
    .footer-accueil p {
      font-size: 10px;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<div id="accueil">

  <div class="header-accueil">
    <div>
      <h1>Mon Miroir 2.0</h1>
      <div class="sous-titre">L'ÉVEIL ET LE SUIVI</div>
    </div>
    <div class="langue-menu">
      <button class="langue-btn" onclick="toggleLangue()">🌐 Langue ▼</button>
      <div class="langue-liste" id="langueListe">
        <button onclick="choisirLangue('fr')">Français</button>
        <button onclick="choisirLangue('ar')">العربية</button>
        <button onclick="choisirLangue('ber')">ⴰⵎⴰⵣⵉⵖ</button>
        <button onclick="choisirLangue('en')">English</button>
        <button onclick="choisirLangue('bm')">Bambara</button>
        <button onclick="choisirLangue('ti')">ትግርኛ</button>
      </div>
    </div>
  </div>

  <div class="menu-principal">
    <a href="/orientation.html?public=pjj" class="menu-btn">
      <span class="icone">🏛️</span> Je suis accompagné par la PJJ / ASE
    </a>
    <a href="/orientation.html?public=rupture" class="menu-btn">
      <span class="icone">🔄</span> Je cherche une nouvelle direction
    </a>
    <a href="/orientation.html?public=grandpublic" class="menu-btn">
      <span class="icone">🎯</span> Je cherche mon orientation
    </a>
  </div>

  <div class="chat-zone" id="chatZone">
    <div class="bubble-wrap mirror">
      <div class="bubble mirror">Je suis là. Tu peux parler.</div>
    </div>
  </div>

  <div class="saisie-bar">
    <input class="saisie-field" id="saisieField" type="text" placeholder="Écris ton message...">
    <button class="btn-envoyer" id="btnEnvoyer">➤</button>
  </div>

  <div class="footer-accueil">
    <img src="/logo-envol.jpg" alt="Envol Production">
    <p>Envol Production</p>
  </div>

</div>

<script>
  const API_CHAT = '/api/chat';
  var selectedLang = localStorage.getItem('monmiroir_langue') || 'fr';
  var conversationHistory = [];

  var chatZone = document.getElementById('chatZone');
  var saisieField = document.getElementById('saisieField');
  var btnEnvoyer = document.getElementById('btnEnvoyer');

  function toggleLangue() {
    document.getElementById('langueListe').classList.toggle('visible');
  }

  function choisirLangue(lang) {
    selectedLang = lang;
    localStorage.setItem('monmiroir_langue', lang);
    document.getElementById('langueListe').classList.remove('visible');
    location.reload();
  }

  async function envoyerMessage() {
    var texte = saisieField.value.trim();
    if (!texte) return;
    saisieField.value = '';

    ajouterBulle(texte, 'user');
    conversationHistory.push({ role: 'user', content: texte });

    ajouterTyping();

    try {
      var res = await fetch(API_CHAT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: conversationHistory,
          language: selectedLang,
          mode: 'miroir'
        })
      });
      var data = await res.json();
      var reply = data.reply || 'Je suis là.';
      conversationHistory.push({ role: 'assistant', content: reply });
      retirerTyping();
      ajouterBulle(reply, 'mirror');
    } catch (err) {
      retirerTyping();
      ajouterBulle('Je suis là.', 'mirror');
    }
  }

  function ajouterBulle(texte, type) {
    var wrap = document.createElement('div');
    wrap.className = 'bubble-wrap ' + type;
    var isRtl = /[\u0600-\u06FF]/.test(texte);
    var bubbleClass = 'bubble ' + type + (isRtl ? ' rtl' : '');
    wrap.innerHTML = '<div class="' + bubbleClass + '">' + texte + '</div>' +
      '<div class="timestamp">' + now() + '</div>';
    chatZone.appendChild(wrap);
    chatZone.scrollTop = chatZone.scrollHeight;
  }

  function ajouterTyping() {
    var wrap = document.createElement('div');
    wrap.className = 'bubble-wrap mirror';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    chatZone.appendChild(wrap);
    chatZone.scrollTop = chatZone.scrollHeight;
  }
  function retirerTyping() {
    var t = document.getElementById('typingIndicator');
    if (t) t.remove();
  }

  function now() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  btnEnvoyer.addEventListener('click', envoyerMessage);
  saisieField.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') envoyerMessage();
  });
</script>

</body>
</html>
