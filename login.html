<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Miroir - Espace Jeune</title>
    <style>
        :root {
            --soft-blue: #e3f2fd;
            --main-blue: #2196f3;
            --dark-blue: #1976d2;
            --text-dark: #333;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--soft-blue); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        
        /* Zone de l'Avatar */
        #avatar-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
        }
        .avatar-circle { 
            width: 180px; 
            height: 180px; 
            border-radius: 50%; 
            border: 4px solid white; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            overflow: hidden; 
            background: white; 
        }
        .avatar-circle img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Zone de Dialogue */
        #chat-zone { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .bubble { 
            max-width: 80%; 
            padding: 12px 18px; 
            border-radius: 20px; 
            font-size: 1.1rem; 
            line-height: 1.4; 
        }
        .bot { 
            background: white; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .user { 
            background: var(--main-blue); 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }

        /* Actions rapides (Boutons sous la bulle) */
        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .action-chip {
            background: white;
            color: var(--dark-blue);
            border: 2px solid var(--main-blue);
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(33, 150, 243, 0.15);
        }
        .action-chip:hover {
            background: var(--main-blue);
            color: white;
            transform: translateY(-2px);
        }

        /* Contrôles */
        #controls { 
            padding: 30px; 
            display: flex; 
            justify-content: center; 
            background: white; 
            border-top-left-radius: 30px; 
            border-top-right-radius: 30px; 
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
        }
        .mic-btn { 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            background: #ff5252; 
            border: none; 
            color: white; 
            font-size: 24px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(255,82,82,0.4); 
            transition: transform 0.2s; 
        }
        .mic-btn:active { 
            transform: scale(0.9); 
        }
    </style>
</head>
<body>

    <div id="avatar-container">
        <div class="avatar-circle">
            <img src="votre-image.jpg" alt="Votre Interprète">
        </div>
        <div id="status-wave"></div>
    </div>

    <div id="chat-zone">
        <div class="bubble bot">
            Bonjour ! Je suis là pour t'écouter. Tu veux qu'on discute de ton parcours, ou tu préfères découvrir un métier en vidéo ?
        </div>
        
        <div class="quick-actions">
            <button class="action-chip" onclick="selectPath('recit')">🗣️ Raconter mon histoire</button>
            <button class="action-chip" onclick="selectPath('video')">🎬 Voir un métier en 10s</button>
        </div>
    </div>

    <div id="controls">
        <button class="mic-btn" onclick="startRecognition()">🎤</button>
    </div>

    <script>
        function selectPath(type) {
            if (type === 'recit') {
                console.log("Lancement du module Récit (IA 1)");
                // Logique de déclenchement pour le module Récit
            } else if (type === 'video') {
                console.log("Lancement du module Vidéo (IA 2)");
                // Logique de déclenchement pour le module Vidéo 10s
            }
        }

        function startRecognition() {
            console.log("Écoute vocale activée...");
        }
    </script>
</body>
</html>
