<!DOCTYPE html>
<html>
<body>

<h2>Thomas</h2>

<div id="chat"></div>

<script>

function addMessage(text) {
    let div = document.createElement("div");
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

function addButton(text) {
    let btn = document.createElement("button");
    btn.innerText = text;

    btn.onclick = function () {
        addMessage("👉 " + text);
    };

    document.getElementById("chat").appendChild(btn);
}

addMessage("Salut, moi c’est Thomas.");
addButton("Raconter ce qui s’est passé");
addButton("Parler de moi");
addButton("Je ne sais pas");

</script>

</body>
</html>
