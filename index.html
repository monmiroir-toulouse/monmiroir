<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Miroir - Prototype V2.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-warm: #FDFBF7;
            --card-white: #FFFFFF;
            --primary-navy: #1A3A5C;
            --success-green: #2E7D32;
            --danger-red: #C0392B;
            --gold-soft: #C9A84C;
            --thinking-blue: #5D6D7E;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-warm);
            font-family: 'Lato', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- ACCUEIL --- */
        #onboarding {
            position: fixed; inset: 0; z-index: 1000;
            background-color: var(--bg-warm);
            display: flex; align-items: center; justify-content: center; padding: 20px;
            transition: opacity 0.5s ease;
        }

        .intro-card {
            background: var(--card-white); padding: 40px 30px; border-radius: 30px;
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            max-width: 400px; border: 1px solid rgba(201, 168, 76, 0.2);
        }

        .btn-ready {
            background: var(--primary-navy); color: white; border: none;
            padding: 18px 45px; border-radius: 50px; font-weight: bold; cursor: pointer;
        }

        /* --- ZONE VISUELLE --- */
        .main-display {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }

        .wave-circle {
            width: 260px; height: 260px;
            background: radial-gradient(circle, var(--gold-soft) 0%, transparent 75%);
            border-radius: 50%; opacity: 0; transition: all 0.5s ease;
        }

        .wave-active { opacity: 0.4; animation: pulse-wave 1.5s infinite ease-in-out; }
        .wave-thinking { background: radial-gradient(circle, var(--thinking-blue) 0%, transparent 75%); opacity: 0.3; animation: pulse-slow 3s infinite ease-in-out; }

        @keyframes pulse-wave { 0% { transform: scale(0.9); } 50% { transform: scale(1.2); } 100% { transform: scale(0.9); } }
        @keyframes pulse-slow { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .status-indicator { margin-top: 30px; font-weight: 700; font-size: 20px; color: var(--primary-navy); text-align: center; padding: 0 20px; }

        /* --- CONTRÔLES --- */
        .controls { padding-bottom: 60px; display: flex; justify-content: space-evenly; align-items: center; width: 100%; }

        .btn-call {
            width: 110px; height: 110px; border-radius: 50%; border: none;
            color: white; font-size: 45px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .btn-start { background-color: var(--success-green); }
        .btn-stop { background-color: var(--danger-red); opacity: 0.3; pointer-events: none; }
        
        .btn-active { opacity: 1 !important; pointer-events: auto !important; }
        .btn-inactive { opacity: 0.3 !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <div id="onboarding">
        <div class="intro-card">
            <h1 style="font-family:'Poppins'; color:var(--primary-navy);">Prêt ?</h1>
            <p style="font-size:18px; color:#5D6D7E;">Appuie sur le bouton vert pour parler.<br>Je vais t'écouter sans te juger.</p>
            <button class="btn-ready" onclick="closeOnboarding()">Commencer l'appel</button>
        </div>
    </div>

    <div class="main-display">
        <div id="wave" class="wave-circle"></div>
        <div id="status" class="status-indicator">En attente...</div>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn-call btn-start" onclick="handleStart()">📞</button>
        <button id="stopBtn" class="btn-call btn-stop" onclick="handleStop()">🛑</button>
    </div>

  <script>
    const statusText = document.getElementById('status');
    const wave = document.getElementById('wave');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let recognition;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'fr-FR';
    }

    function playSound(freq, duration) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); 
            gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.start(); 
            osc.stop(ctx.currentTime + duration);
        } catch (e) {
            console.log("Audio non supporté");
        }
    }

    function closeOnboarding() {
        const ob = document.getElementById('onboarding');
        ob.style.opacity = '0';
        setTimeout(() => {
            ob.style.display = 'none';
        }, 500);
    }

    function handleStart() {
        if (navigator.vibrate) navigator.vibrate(60);
        playSound(523, 0.1);

        statusText.innerText = "Je t'écoute...";
        statusText.style.color = "var(--success-green)";
        wave.className = "wave-circle wave-active";
        
        startBtn.classList.add('btn-inactive');
        stopBtn.classList.add('btn-active');

        if (recognition) {
            recognition.start();
        }
    }

    if (recognition) {
        recognition.onspeechend = () => {
            statusText.innerText = "Je réfléchis...";
            statusText.style.color = "var(--thinking-blue)";
            wave.className = "wave-circle wave-thinking";
        };
    }

    function handleStop() {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        playSound(329, 0.2);

        statusText.innerText = "Appel terminé.";
        statusText.style.color = "var(--primary-navy)";
        wave.className = "wave-circle";
        
        stopBtn.classList.remove('btn-active');
        startBtn.classList.remove('btn-inactive');

        if (recognition) {
            recognition.stop();
        }
        
        alert("Récit sécurisé. Ton miroir est prêt.");
    }
</script>
 
    </script>
</body>
</html>
